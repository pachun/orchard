# Catppuccin Frappé colors for fuzzel. Loaded by config/fuzzel/
# fuzzel.ini through ~/.config/orchard-themes/active/fuzzel.ini —
# the main fuzzel.ini owns layout/font/keybinds; everything color
# lives here so set-theme swaps palettes by repointing `active`.
#
# Selected row uses surface1 (#414559) as the row background and
# blue (#8caaee) as the match-highlight, kept consistent across
# selected/unselected so highlights stay readable on either bg.

[colors]
background=303446ee
text=c6d0f5ff
prompt=b5bfe2ff
input=c6d0f5ff
match=8caaeeff
selection=414559ff
selection-text=c6d0f5ff
selection-match=8caaeeff
border=949cbbff
