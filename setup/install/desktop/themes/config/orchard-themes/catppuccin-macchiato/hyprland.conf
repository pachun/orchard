# Window border colors for Catppuccin Macchiato. Sourced by the main
# hyprland.conf through the orchard-themes/active symlink, so a
# set-theme switch repaints borders to match. Active = blue accent;
# inactive = surface1, which recedes against the base. Border width
# itself lives in the main config's general block.
general {
    col.active_border = rgb(8aadf4)
    col.inactive_border = rgb(494d64)
}
