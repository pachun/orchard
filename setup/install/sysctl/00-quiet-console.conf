# Force a quieter console: only critical+ messages render on the TTY.
# The kernel cmdline `loglevel=2` *should* do this, but the linux-asahi
# kernel resets console_loglevel to 4 (warning+) at runtime — whether
# from a build-time default or some early-boot fixup, hard to tell.
# Setting it via /etc/sysctl.d/ guarantees systemd-sysctl applies our
# value after that fixup runs.
#
# Format: console_loglevel default_message_loglevel
#         minimum_console_loglevel default_console_loglevel
kernel.printk = 1 4 1 7
