autogenerated = 1

$modifier = SUPER

$terminalApplication = ghostty
$browserApplication = chromium

$quitHyprland = command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit

bind = $modifier, RETURN, exec, $terminalApplication
bind = $modifier, B, exec, $browserApplication
bind = $modifier, M, exec, $quitHyprland

bind = $modifier, 1, workspace, 1
bind = $modifier, 2, workspace, 2

# F1 / F2: screen brightness down/up
# (in fnmode=3 these keys emit XF86MonBrightnessDown/Up directly)
# screen-brightness handles the bl_power flip so 0% truly turns the panel off
bind = , XF86MonBrightnessDown, exec, $HOME/.local/bin/screen-brightness down
bind = , XF86MonBrightnessUp,   exec, $HOME/.local/bin/screen-brightness up

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

cursor {
    # hide the cursor while typing
    hide_on_key_press = true
}

input {
    kb_layout = us

    # remap caps lock to control
    kb_options = ctrl:nocaps

    # increase mouse sensitivity
    sensitivity = 0.5

    touchpad {
    	# use sane scroll direction
        natural_scroll = true

	# disable the cursor while typing
	disable_while_typing = true

	# decrease scroll sensitivity
	scroll_factor = 0.1
    }
}
