$modifier = SUPER

$terminalApplication = ghostty
$browserApplication = chromium
$mapsApplication = gnome-maps
$weatherApplication = gnome-weather
$messagesApplication = bluebubbles
$gitApplication      = gitg

$quitHyprland = command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit

bind = $modifier, RETURN, exec, $HOME/.local/bin/focus-or-launch com.mitchellh.ghostty $terminalApplication
bind = $modifier, B, exec, $HOME/.local/bin/focus-or-launch chromium $browserApplication
# Incognito chromium normally inherits the same WM_CLASS as a regular
# chromium window, so focus-or-launch couldn't tell them apart. Override
# WM_CLASS via --class=chromium-incognito so the incognito window has
# its own class and we can focus it (or spawn it) independently.
bind = $modifier SHIFT, B, exec, $HOME/.local/bin/focus-or-launch chromium-incognito $browserApplication --incognito --class=chromium-incognito
bind = $modifier, E, exec, $terminalApplication -e yazi

# Screenshots + recording, macOS-style shortcuts.
# Cmd+Shift+3 → full-screen capture
# Cmd+Shift+4 → region capture (slurp picker)
# Cmd+Shift+5 → toggle screen recording (region picker on first press)
# All save to ~/pictures/screenshots/ or ~/videos/recordings/ AND copy
# the screenshot to the clipboard for immediate paste.
bind = $modifier SHIFT, 3, exec, $HOME/.local/bin/screenshot full
bind = $modifier SHIFT, 4, exec, $HOME/.local/bin/screenshot region
bind = $modifier SHIFT, 5, exec, $HOME/.local/bin/screenrecord
bind = $modifier, M, exec, $HOME/.local/bin/focus-or-launch org.gnome.Maps     $mapsApplication
bind = $modifier, apostrophe, exec, $HOME/.local/bin/focus-or-launch org.gnome.Weather $weatherApplication
bind = $modifier, I, exec, $HOME/.local/bin/bluebubbles-toggle
bind = $modifier, G, exec, $HOME/.local/bin/focus-or-launch org.gnome.gitg $gitApplication
bind = $modifier, N, exec, $HOME/.local/bin/wifi-menu
bind = $modifier, P, exec, $HOME/.local/bin/nordvpn-menu
bind = $modifier, escape, exec, $quitHyprland

# Cmd+Q quits the focused window (macOS-style). Works for any app at the
# WM level, regardless of whether the app itself has a Ctrl+Q binding.
# A separate watcher daemon (hypr-empty-workspace-watcher in exec-once
# below) handles jumping back to the previous workspace when this kill
# — or any other close path — leaves the current workspace empty.
bind = $modifier, Q, killactive,
bind = $modifier SHIFT, Q, forcekillactive,

# Ctrl+Cmd+Space opens an emoji picker (macOS-style). rofimoji draws via
# wofi and types the selected emoji into the focused window via wtype.
# Toggle: if fuzzel (the picker UI) is open, close it; otherwise launch rofimoji.
bind = $modifier CTRL, space, exec, sh -c 'pkill -x fuzzel || rofimoji --action type --skin-tone neutral --prompt "" --selector fuzzel'

# Cmd+Shift+V opens a fuzzel-rendered list of recent clipboard entries.
# wl-paste --watch (started in exec-once below) feeds cliphist; the
# selected entry is decoded and re-copied so the next paste uses it.
bind = $modifier SHIFT, V, exec, sh -c 'cliphist list | fuzzel --dmenu --width=60 --lines=15 | cliphist decode | wl-copy'

# Layer-shell animations: mako notifications slide in/out from the right
# edge (where they're anchored). Other layer surfaces (fuzzel launcher,
# swayosd OSD) opt out via `layerrule = noanim` below — popups need to
# feel instant. Layer fades stay off because mako has its own fade and
# double-stacking made the slide look mushy.
animations {
    # IN: ease-out — fast arrival, soft settle.
    # OUT: ease-in — slow start, accelerate off-screen.
    # Same bezier used symmetrically reads as "snap then linger" on the
    # outbound, so split them.
    bezier = mako-in,  0.215, 0.61, 0.355, 1
    bezier = mako-out, 0.55, 0.055, 0.675, 0.19
    animation = layersIn,  1, 3, mako-in,  slide right
    animation = layersOut, 1, 4, mako-out, slide right
}

# Scope the slide above to mako only. If something else animates
# unexpectedly, find its layer namespace with `hyprctl layers` and add
# another `layerrule = noanim, <namespace>` line.
layerrule = no_anim on, match:namespace launcher
layerrule = no_anim on, match:namespace swayosd
# hyprpicker is the screen-freeze overlay used by ~/.local/bin/screenshot
# during region capture. Without this rule it inherits the global
# layersIn slide-from-right, which feels jarring for what should be
# an instant freeze.
layerrule = no_anim on, match:namespace hyprpicker
layerrule = animation slide right, match:namespace notifications

# Ctrl+Left/Right cycles workspaces, matching macOS Mission Control.
# The workspace-cycle script constrains motion to occupied workspaces +
# one blank to the right, so you can't drift into infinite empty desktops.
# Trade-off: Ctrl+arrow word navigation in text fields is lost at the
# system level — use Alt+arrow inside apps that support it instead.
bind = CTRL, left,  exec, $HOME/.local/bin/workspace-cycle left
bind = CTRL, right, exec, $HOME/.local/bin/workspace-cycle right
# Cmd+Left / Cmd+Right do the same thing — bound directly here rather
# than via an xremap Super→Ctrl translation, so apps still see Ctrl+Left
# as word-navigation in text fields without triggering a workspace cycle.
bind = $modifier, left,  exec, $HOME/.local/bin/workspace-cycle left
bind = $modifier, right, exec, $HOME/.local/bin/workspace-cycle right

# Ctrl+1..Ctrl+5 jump directly to workspace 1..5 (macOS Spaces shortcut).
# Capped at 5 to match the workspace count shown in waybar; workspace-cycle
# also enforces this so Ctrl+→ can't drift past 5.
#
# Dispatched from xremap (see dotfiles/config/xremap/config.yml) instead
# of as a Hyprland bind. Hyprland binds run before the focused app gets
# the keypress, so a global `bind = CTRL, 1, ...` would steal Ctrl+1
# from chromium tab switching (which is fed by Cmd+1 → Ctrl+1 via
# xremap). Handling Ctrl+1..5 in xremap lets us route the workspace
# switch and the chromium tab switch from the same physical inputs
# without collision.

# Cmd+Ctrl+1..5 moves the focused window to workspace 1..5 and follows
# it (was Cmd+Shift+1..5 originally; reassigned because Cmd+Shift+3/4/5
# now belong to screenshot/recording).
#
# Dispatched from xremap alongside the Ctrl+1..5 workspace binds — see
# the comment block on Ctrl+1..5 above for the why. Keeping these in
# the same place avoids subtle ordering issues between xremap's
# exact-match rules and Hyprland's bind matcher.

# Open new windows on the lowest-numbered empty workspace, but…
windowrule = match:class .*, workspace empty
# …keep dialogs / file pickers / popups (anything that auto-floats) on
# the current workspace as overlays instead of yeeting them to a fresh
# desktop. The rule below overrides the workspace assignment above for
# floating windows only.
windowrule = match:float 1, workspace unset

# xdg-desktop-portal-gtk hosts file pickers and other system dialogs for
# apps that don't have their own (chromium's Save As, Open File, etc.).
# Hyprland doesn't auto-float them, so explicitly float + size + center
# so they read as overlays instead of fullscreen tiles.
windowrule = match:class xdg-desktop-portal-gtk, workspace unset
windowrule = match:class xdg-desktop-portal-gtk, float on
windowrule = match:class xdg-desktop-portal-gtk, size 900 600
windowrule = match:class xdg-desktop-portal-gtk, center on

# --- hardware key bindings ---------------------------------------------
# These do the actual work (audio level, brightness). They route through
# swayosd-client (audio) or the screen-brightness script (which calls
# swayosd-client at the end), so each action also pops the OSD overlay.
# To swap the OSD layer, see the swayosd block below.

# F1 / F2: screen brightness down/up
# (in fnmode=3 these keys emit XF86MonBrightnessDown/Up directly)
# screen-brightness handles the bl_power flip so 0% truly turns the panel off
bind = , XF86MonBrightnessDown, exec, $HOME/.local/bin/screen-brightness down
bind = , XF86MonBrightnessUp,   exec, $HOME/.local/bin/screen-brightness up

# F6 toggles do-not-disturb mode in mako. Suppresses notifications
# until pressed again (or the waybar bell is clicked). On Apple
# keyboards in fnmode=3, F6 emits XF86Sleep — binding the literal F6
# keysym wouldn't fire, and worse, logind catches XF86Sleep and would
# put the screen to sleep. Hyprland binds run before logind sees the
# key, so claiming XF86Sleep here both intercepts the sleep and gives
# us our DND toggle.
bind = , XF86Sleep, exec, $HOME/.local/bin/dnd-toggle

# F10 / F11 / F12: mute / volume down / volume up (5% step)
# Up/down also unmute (matches macOS); the wpctl call is a no-op if already unmuted.
bind = , XF86AudioMute,         exec, swayosd-client --output-volume mute-toggle
bind = , XF86AudioLowerVolume,  exec, sh -c 'wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; swayosd-client --output-volume -5'
bind = , XF86AudioRaiseVolume,  exec, sh -c 'wpctl set-mute @DEFAULT_AUDIO_SINK@ 0; swayosd-client --output-volume +5'

# F7 / F8 / F9: prev / play-pause / next (whichever MPRIS player is active)
bind = , XF86AudioPrev,         exec, swayosd-client --playerctl prev
bind = , XF86AudioPlay,         exec, swayosd-client --playerctl play-pause
bind = , XF86AudioNext,         exec, swayosd-client --playerctl next

# --- OSD layer ---------------------------------------------------------
# swayosd shows the popup pill on volume/brightness changes. Purely
# visual; the audio/brightness work above happens regardless. To replace
# it: change `swayosd-client` calls above to wob/avizo/etc and swap this
# exec-once for that daemon's startup command.
exec-once = swayosd-server

# --- auth agent --------------------------------------------------------
# Polkit auth agent — pops the GUI password prompt when apps need
# privilege escalation (mounting drives, etc.).
exec-once = $HOME/.local/bin/fuzzel-polkit-agent --width=30

# Top status bar.
exec-once = waybar

# Geoclue agent — without this, geoclue can't grant location permission
# to apps (gnome-shell normally provides one; on Hyprland we don't have
# that, so we run the bundled demo agent which auto-allows). Required
# for gnome-maps "find me" to work, plus any future location-aware tool.
exec-once = /usr/lib/geoclue-2.0/demos/agent

# Switch to the previously-used workspace when the active one becomes
# empty (any close path: Cmd+Q, ghostty's Cmd+W on the last tab, etc.).
exec-once = $HOME/.local/bin/hypr-empty-workspace-watcher

# Notification daemon — paints toasts for org.freedesktop.Notifications.
exec-once = mako

# Clipboard history watchers: cliphist stores every text/image copy so
# Cmd+Shift+V can pull them back. Two watchers because wl-paste --watch
# only handles one MIME type per invocation.
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Propagate Hyprland's session env (incl. QT_QPA_PLATFORMTHEME) into D-Bus
# and systemd user services so xdg-desktop-portal-hyprland (D-Bus-launched
# lazily on first screencast) sees the Qt theme variables.
exec-once = sh -c 'dbus-update-activation-environment --systemd --all'

# Restart xremap now that the wayland session is up, so it can connect
# to Hyprland's foreign-toplevel protocol and see app classes — without
# this, per-app rules (the ghostty exclusion) silently fail because
# xremap can't tell which window is focused.
exec-once = systemctl --user restart xremap.service

# Wallpaper — swaybg paints the image via wlr-layer-shell. No config file;
# image path and fit mode are passed on the command line.
exec-once = swaybg -i $HOME/.local/share/wallpapers/dharmx-flower.png -m fill

# --- key remapping -----------------------------------------------------
# xremap translates Cmd+C/V/X/A/Z to Ctrl+ equivalents in non-terminal
# apps so macOS-style shortcuts work everywhere. Ghostty is excluded in
# xremap's config; ghostty handles Super+C/V via its own keybinds.
# Lifecycle is handled by the systemd user unit at
# dotfiles/config/systemd/user/xremap.service (WantedBy=default.target),
# so it starts at user login — no exec-once needed here.

env = XCURSOR_SIZE,18
env = HYPRCURSOR_SIZE,18

# Qt theming pipeline: qt6ct reads ~/.config/qt6ct/qt6ct.conf, which
# delegates to Kvantum, which reads ~/.config/Kvantum/kvantum.kvconfig
# for the active theme (Catppuccin Frappé). Affects hyprland-share-picker
# and any other Qt app.
env = QT_QPA_PLATFORMTHEME,qt6ct

# When an app sends an XDG activation request (e.g. chromium opening
# an image from yazi, or Slack/etc. surfacing a notification), follow
# the request and focus that window instead of staying put. Off by
# default — without this, opening a file in an external app silently
# routes it to a window/workspace you have to navigate to manually.
misc {
    focus_on_activate = true
}

cursor {
    # hide the cursor while typing
    hide_on_key_press = true
    # don't yank the cursor to the new window when focuswindow / workspace
    # switches happen — leaves the pointer where the user put it
    no_warps = true
}

# Remove window borders + gaps so each window takes its full allotted area.
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}

input {
    kb_layout = us

    # remap caps lock to control
    kb_options = ctrl:nocaps

    # increase mouse sensitivity
    sensitivity = 0.5

    touchpad {
    	# use sane scroll direction
        natural_scroll = true

	# disable the cursor while typing
	disable_while_typing = true

	# decrease scroll sensitivity
	scroll_factor = 0.1
    }
}
