# Remap macOS-style Cmd+letter shortcuts to their Ctrl+letter equivalents,
# everywhere except the terminal (where Ctrl+C must remain SIGINT, and the
# terminal handles Cmd+C as copy via its own keybind).
#
# On Apple keyboards, Cmd is the Super key. Hyprland's window-manager binds
# (Super+RETURN, Super+B, etc.) are NOT affected because we only remap the
# specific letter combos listed below — bare Super and Super+other-keys
# pass through untouched.

# Caps Lock → Ctrl at the input layer. Done in xremap rather than via
# Hyprland's `kb_options = ctrl:nocaps` so the keymap rules below see
# real Ctrl events when the user presses Caps. Hyprland's XKB-level
# remap runs *after* xremap, so it would have left xremap blind to the
# Caps-as-Ctrl press.
modmap:
  - name: caps lock → control
    remap:
      CapsLock: Ctrl_L

keymap:
  - name: macOS-style shortcuts (skipped in ghostty)
    # exact_match=true keeps these rules from swallowing Shift-modified
    # variants. Without it, xremap's default loose-match treats Super-3
    # as matching Super+Shift+3, which would steal the screenshot bind
    # (and Super-V the clipboard-history bind, etc.) before Hyprland
    # ever sees them.
    exact_match: true
    application:
      not:
        - com.mitchellh.ghostty
    remap:
      Super-c: C-c   # copy
      Super-v: C-v   # paste
      Super-x: C-x   # cut
      Super-a: C-a   # select all
      Super-z: C-z   # undo
      Super-w: C-w   # close tab (or window if last tab)
      Super-t: C-t   # new tab
      Super-Shift-t: C-Shift-t   # reopen last closed tab
      Super-f: C-f   # find in page
      Super-s: C-s   # save
      Super-r: C-r   # reload page

  - name: tab navigation (Cmd+Shift+[/]) — applied everywhere
    remap:
      # Cmd+Shift+[ → Ctrl+Shift+Tab (previous tab)
      Super-Shift-LeftBrace: C-Shift-Tab
      # Cmd+Shift+] → Ctrl+Tab (next tab)
      Super-Shift-RightBrace: C-Tab

  # More specific (Super+Ctrl+N) MUST come before Super+N. xremap evaluates
  # rules top-down and stops at the first match; if Super+N came first,
  # Cmd+Ctrl+N would trigger a workspace switch instead of moving the
  # focused window.
  #
  # exact_match=true on both rules below for the same reason as the
  # macOS-style shortcuts above: without it, Super-3 also matches
  # Super+Shift+3, stealing the Cmd+Shift+3 screenshot bind.
  - name: move window to workspace (Cmd+Ctrl+1..5)
    exact_match: true
    remap:
      Super-Ctrl-1: { launch: ["hyprctl", "dispatch", "movetoworkspace", "1"] }
      Super-Ctrl-2: { launch: ["hyprctl", "dispatch", "movetoworkspace", "2"] }
      Super-Ctrl-3: { launch: ["hyprctl", "dispatch", "movetoworkspace", "3"] }
      Super-Ctrl-4: { launch: ["hyprctl", "dispatch", "movetoworkspace", "4"] }
      Super-Ctrl-5: { launch: ["hyprctl", "dispatch", "movetoworkspace", "5"] }

  - name: workspace switching (Cmd+1..5)
    exact_match: true
    remap:
      Super-1: { launch: ["hyprctl", "dispatch", "workspace", "1"] }
      Super-2: { launch: ["hyprctl", "dispatch", "workspace", "2"] }
      Super-3: { launch: ["hyprctl", "dispatch", "workspace", "3"] }
      Super-4: { launch: ["hyprctl", "dispatch", "workspace", "4"] }
      Super-5: { launch: ["hyprctl", "dispatch", "workspace", "5"] }
