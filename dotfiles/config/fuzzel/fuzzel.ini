# fuzzel config — drives every popup picker (wifi, NordVPN, system,
# clipboard, polkit, rofimoji emoji). SF Pro Text matches waybar; Phosphor
# + Nerd Font Mono are the icon-glyph fallbacks. Catppuccin Frappé palette.

[main]
font=SF Pro Text:style=Medium:size=11,Phosphor:size=12,Symbols Nerd Font Mono:size=10
lines=8
width=42
horizontal-pad=14
vertical-pad=10
inner-pad=10
line-height=20
# Defaults left in place (layer=overlay, keyboard-focus=exclusive).
# We tried on-demand + top-layer to make clicking another waybar
# icon toggle to that menu, but Hyprland's pointer routing for
# layer-shell surfaces left enough rough edges (cursor wouldn't
# re-resolve until you wiggled, Esc wouldn't reach fuzzel when the
# mouse was over the desktop, hover-on-desktop dismissed the menu)
# that the trade wasn't worth it. The hotkey route (Mod+B / N / P /
# comma) covers menu-switching cleanly. If we want click-driven
# menu switching back, fuzzel probably isn't the right tool — a
# popup that's a real toplevel window (or a different launcher
# whose layer-shell behavior is more configurable) would fit
# better.

[border]
width=1
radius=10

[key-bindings]
# Vim-style navigation alongside the defaults. Some of these have fuzzel
# readline-style defaults (delete-line-forward on Ctrl+K, etc.) that we
# unbind first so our nav bindings take precedence.
delete-line-forward=none
delete-line-backward=none
delete-next=none
prev=Up Control+k
next=Down Control+j
prev-page=Page_Up Control+u
next-page=Page_Down Control+d
execute=Return Control+l

[colors]
# Catppuccin Frappé. Selected row uses surface1 as the row background and
# blue as the match-highlight, both for the unselected row's match and
# the selected row's match — keeps the highlight readable on either bg.
background=303446ee
text=c6d0f5ff
prompt=b5bfe2ff
input=c6d0f5ff
match=8caaeeff
selection=414559ff
selection-text=c6d0f5ff
selection-match=8caaeeff
border=949cbbff
