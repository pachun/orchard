# fuzzel config — used by rofimoji's emoji popup.
# Catppuccin Mocha-ish dark theme.

[main]
font=monospace:size=14
lines=10
width=60
horizontal-pad=16
vertical-pad=12
inner-pad=8
prompt=

[border]
width=1
radius=10

[key-bindings]
# Vim-style navigation alongside the defaults. Some of these have fuzzel
# readline-style defaults (delete-line-forward on Ctrl+K, etc.) that we
# unbind first so our nav bindings take precedence.
delete-line-forward=none
delete-line-backward=none
delete-next=none
prev=Up Control+k
next=Down Control+j
prev-page=Page_Up Control+u
next-page=Page_Down Control+d

[colors]
# Generic dark — neutral grays, fully opaque.
background=1a1a1aff
text=e0e0e0ff
prompt=ffffffff
input=ffffffff
match=ffffffff
selection=3a3a3aff
selection-text=ffffffff
selection-match=ffffffff
border=3a3a3aff
