# Catppuccin Macchiato colors for tmux. Sourced from the main
# tmux.conf through ~/.config/orchard-themes/active/tmux.conf.
# Reproduces the visual that the previous ANSI-slot setup
# rendered in this palette — surface1 bar, subtext0 active-tab —
# but with explicit hex so a palette change can't silently
# shuffle slot meanings.

# Status line: surface1 bar with text foreground.
set -g status-style "bg=#494d64,fg=#cad3f5"

# Pane borders. Both active and inactive use the same surface1 —
# matches the bar color so window/pane chrome reads as one
# coherent surface.
set -g pane-border-style "fg=#494d64"
set -g pane-active-border-style "fg=#494d64"

# Inactive window tab — subtext1 on surface1.
set -g window-status-style "bg=#494d64,fg=#b8c0e0"

# Active window tab — flipped: surface1 text on a subtext0 slab.
set -g window-status-current-style "bg=#a5adcb,fg=#494d64"
