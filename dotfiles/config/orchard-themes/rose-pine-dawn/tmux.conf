# Rosé Pine Dawn colors for tmux. Sourced from the main tmux.conf
# through ~/.config/orchard-themes/active/tmux.conf. Status bar
# uses `highlight med` (#dfdad9) — one step darker than the
# editor base — so the bar reads as a clearly visible recessed
# strip rather than blending into the cream terminal bg the way
# the ANSI-slot defaults did.

# Status line: cream-grey bar with deep iris-purple text.
set -g status-style "bg=#dfdad9,fg=#575279"

# Pane borders. Inactive borders use `muted` (light grey) — visible
# but quiet; active border is `text` (the deep iris-purple) so the
# focused pane reads at a glance.
set -g pane-border-style "fg=#9893a5"
set -g pane-active-border-style "fg=#575279"

# Inactive window tab — same bg as status, dim text so the active
# tab pops by contrast.
set -g window-status-style "bg=#dfdad9,fg=#797593"

# Active window tab — flipped: deep iris-purple bg with the cream
# base as fg.
set -g window-status-current-style "bg=#575279,fg=#faf4ed"
