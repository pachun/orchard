# Rosé Pine Dawn colors for fuzzel. Loaded by config/fuzzel/
# fuzzel.ini through ~/.config/orchard-themes/active/fuzzel.ini.
# Selected row uses highlight-med (#dfdad9) — one step darker than
# overlay — as a subtle row highlight, with rose (#d7827e) as the
# match color so search hits read warm without being shouty.

[colors]
background=fffaf3ee
text=575279ff
prompt=797593ff
input=575279ff
match=d7827eff
selection=dfdad9ff
selection-text=575279ff
selection-match=d7827eff
border=797593ff
