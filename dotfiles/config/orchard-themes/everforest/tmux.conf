# Everforest colors for tmux. Sourced from the main tmux.conf
# through ~/.config/orchard-themes/active/tmux.conf. Reproduces
# the visual that the previous ANSI-slot setup happened to render
# in this palette — mid-grey status bar, cream foreground, cream
# active-tab — but with explicit hex so a palette change can't
# silently shuffle slot meanings.

# Status line: grey0 bar with cream foreground.
set -g status-style "bg=#7a8478,fg=#f2efdf"

# Pane borders. Both active and inactive use the same grey0 — the
# active pane is already obvious from the cursor and the border-
# only highlight read as fussy here. Override per pane in your own
# config if you want focus-indicating borders.
set -g pane-border-style "fg=#7a8478"
set -g pane-active-border-style "fg=#7a8478"

# Inactive window tab — bright white on grey0.
set -g window-status-style "bg=#7a8478,fg=#fffbef"

# Active window tab — flipped: grey0 text on a cream slab.
set -g window-status-current-style "bg=#f2efdf,fg=#7a8478"
