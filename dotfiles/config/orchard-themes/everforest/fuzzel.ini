# Everforest Medium colors for fuzzel. Loaded by config/fuzzel/
# fuzzel.ini through ~/.config/orchard-themes/active/fuzzel.ini.
# Selected row uses bg1 (#3a464c) as a one-step-lighter row
# background and aqua (#83c092) as the match-highlight — distinctive
# without straying off-palette.

[colors]
background=2d353bee
text=d3c6aaff
prompt=859289ff
input=d3c6aaff
match=83c092ff
selection=3a464cff
selection-text=d3c6aaff
selection-match=83c092ff
border=859289ff
