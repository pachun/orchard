# Chromium command-line flags. One per line. Read on every chromium
# launch from ~/.config/chromium-flags.conf.

# WebRTC's PipeWire backend is needed to share the screen in Meet,
# Discord, Slack huddles, etc. on Wayland. Without it, sharing falls
# through to a placeholder (the avatar tile in Meet's case) because
# chromium can't reach the screencast portal.
#
# Enable VA-API hardware video decode. It needs the intel-media-driver
# package (the iHD VA-API driver) installed; without it, video decodes
# on the CPU. VaapiIgnoreDriverChecks lets Chromium accept an iHD build
# newer than its known-good list, which the Panther Lake / xe stack is.
# Confirm at chrome://gpu -> "Video Decode: Hardware accelerated".
--enable-features=WebRTCPipeWireCapturer,VaapiVideoDecodeLinuxGL,VaapiVideoDecoder,VaapiIgnoreDriverChecks

# Run on Wayland natively when a Wayland compositor is available
# (Hyprland here), otherwise fall back to X11. Avoids fractional-scaling
# blur and lets keyboard shortcuts go through xremap cleanly.
--ozone-platform-hint=auto

# Kill automatic Picture-in-Picture. When a site plays media and you
# switch tabs, Chromium pops the media out into a floating PiP window —
# the Spotify web player registers album art as its media session, so
# tabbing away spawns an album-artwork window. On Hyprland that window
# also trips the "new window -> empty workspace" rule and yanks focus to
# a fresh workspace. There's no enterprise policy for this in Chromium
# (only a chrome://settings/content toggle), so we disable it at the
# feature level: AutoPictureInPicture is the umbrella gating the media-
# session path Spotify uses; the other two are the browser's own video
# heuristics. Manual PiP (the button on a video) is unaffected.
--disable-features=AutoPictureInPicture,AutoPictureInPictureForVideoPlayback,BrowserInitiatedAutomaticPictureInPicture
