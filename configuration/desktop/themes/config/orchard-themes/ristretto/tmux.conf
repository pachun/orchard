# Monokai Pro Ristretto colors for tmux. Sourced from the main
# tmux.conf through ~/.config/orchard-themes/active/tmux.conf.
# Same structure as the catppuccin partials: a gray bar one step
# above the base, muted inactive tabs, and a flipped active tab.

# Status line: selection gray bar with the foreground text.
set -g status-style "bg=#403e41,fg=#e6d9db"

# Pane borders. Both active and inactive match the bar so window/pane
# chrome reads as one coherent surface.
set -g pane-border-style "fg=#403e41"
set -g pane-active-border-style "fg=#403e41"

# Inactive window tab — light foreground on the bar gray.
set -g window-status-style "bg=#403e41,fg=#c3b7b8"

# Active window tab — flipped: bar gray text on a light-foreground slab.
set -g window-status-current-style "bg=#c3b7b8,fg=#403e41"
