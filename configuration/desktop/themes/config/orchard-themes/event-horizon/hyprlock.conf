# Event Horizon's lock screen, after upstream's: the astronaut from its
# unlock.png adrift on the flat graphite base, nothing blurred, and the
# password field down at the bottom with the nebula-pink outline and plasma-
# cyan check. The shared layout's information all stays, just out of the
# astronaut's way: the time and date at their usual size up in the top-left
# with the date centered under the time, the fingerprint prompt under the
# field, the battery in the bottom-right corner.
$background_image = $HOME/.config/orchard-themes/active/lock.png
$background_blur_passes = 0
$background_brightness = 1

$input_size = 24%, 6%
$input_position = 0, 100
$input_valign = bottom
$input_outer_color = rgb(ee64ac)
$input_inner_color = rgba(1c1e26a8)
$input_font_color = rgb(cbced0)
$input_check_color = rgb(59e1e3)
$input_fail_color = rgb(e95678)
$input_placeholder_color = ##9da0a2b3

# The time and the date share one axis, 1168px left of the screen's midline,
# so the date is always centered under the time: hyprlock can't center one
# label on another, but it can center both on the same line. The axis is
# where the time's middle falls with its left edge 56px in at a one-digit
# hour; from ten to twelve the wider time reaches 47px further left.
$clock_color = rgb(cbced0)
$clock_position = -1168, -36
$clock_valign = top

$date_color = rgb(9da0a2)
$date_position = -1168, -283
$date_valign = top

$fingerprint_prompt_color = rgb(9da0a2)
$fingerprint_prompt_position = 0, 64
$fingerprint_prompt_valign = bottom

$battery_color = rgb(9da0a2)
$battery_position = -40, 40
$battery_halign = right
