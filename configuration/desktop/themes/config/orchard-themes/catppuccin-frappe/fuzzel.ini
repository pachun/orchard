# Catppuccin Frappé colors for fuzzel. Loaded by config/fuzzel/fuzzel.ini
# through ~/.config/orchard-themes/active/fuzzel.ini — the main fuzzel.ini
# owns layout/font/keybinds; everything colour lives here so set-theme swaps
# palettes by repointing `active`.
#
# The panel sits on surface0, not base. base is what the windows behind it are
# painted in — a menu drawn in the same colour as the thing it floats over is
# not a panel, it is a hole. Catppuccin ships base → surface0 → surface1 →
# surface2 precisely so something above something else can be lighter, and the
# menu was standing on the ground floor. The selected row climbs again, to
# surface2, so it still separates from the panel it sits in.
#
# Fully opaque. It was 93%, and terminal text behind it was legible straight
# through the menu.
#
# The border is blue — the same blue hyprland gives a focused window
# (col.active_border). The menu takes keyboard focus exclusively while it is
# up, so it wears what focus looks like here. Open a menu and the accent moves
# from your window to the menu.

[colors]
background=414559ff
text=c6d0f5ff
prompt=b5bfe2ff
input=c6d0f5ff
match=8caaeeff
selection=626880ff
selection-text=c6d0f5ff
selection-match=8caaeeff
border=8caaeeff
