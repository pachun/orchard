# Window border colors for Everforest Dark. Sourced by the main
# hyprland.conf through the orchard-themes/active symlink, so a
# set-theme switch repaints borders to match. Active = the signature
# everforest green; inactive = a muted surface tone that recedes.
# Border width itself lives in the main config's general block.
general {
    col.active_border = rgb(a7c080)
    col.inactive_border = rgb(4f585e)
}
