# Everforest colors for fuzzel. See catppuccin-frappe/fuzzel.ini for the
# reasoning; the ramp here is bg0 → bg2 → bg4, and the focus colour is the
# green hyprland uses for an active window border.
#
# prompt moves from grey1 to grey2: the panel got lighter, so the dimmest text
# on it has to as well or it stops being readable.

[colors]
background=3d484dff
text=d3c6aaff
prompt=9da9a0ff
input=d3c6aaff
match=a7c080ff
selection=4f585eff
selection-text=d3c6aaff
selection-match=a7c080ff
border=a7c080ff
