# Catppuccin Macchiato colors for fuzzel. Loaded by config/fuzzel/
# fuzzel.ini through ~/.config/orchard-themes/active/fuzzel.ini —
# the main fuzzel.ini owns layout/font/keybinds; everything color
# lives here so set-theme swaps palettes by repointing `active`.
#
# Selected row uses surface0 (#363a4f) as the row background and
# blue (#8aadf4) as the match-highlight, kept consistent across
# selected/unselected so highlights stay readable on either bg.

[colors]
background=24273aee
text=cad3f5ff
prompt=b8c0e0ff
input=cad3f5ff
match=8aadf4ff
selection=363a4fff
selection-text=cad3f5ff
selection-match=8aadf4ff
border=939ab7ff
