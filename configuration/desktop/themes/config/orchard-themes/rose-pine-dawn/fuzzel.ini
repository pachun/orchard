# Rosé Pine Dawn colors for fuzzel. The light theme, and the one place the
# elevation trick does not work: the panel already sits on the lightest surface
# the palette has, and you cannot climb above white.
#
# So on this theme the edge does the whole job. The border is iris — the colour
# hyprland gives a focused window — and it has to carry the separation that
# lightness carries on the dark themes.
#
# Still opaque, for the same reason: text behind a menu should not be readable
# through it.

[colors]
background=fffaf3ff
text=575279ff
prompt=797593ff
input=575279ff
match=907aa9ff
selection=dfdad9ff
selection-text=575279ff
selection-match=907aa9ff
border=907aa9ff
