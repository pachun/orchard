# Window border colors for Rosé Pine Dawn (light). Sourced by the main
# hyprland.conf through the orchard-themes/active symlink, so a
# set-theme switch repaints borders to match. Active = iris, dark
# enough to read against the light base; inactive = the muted highlight
# tone. Border width itself lives in the main config's general block.
general {
    col.active_border = rgb(907aa9)
    col.inactive_border = rgb(cecacd)
}
