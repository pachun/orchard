# Rosé Pine Moon colors for tmux. Sourced from the main tmux.conf through
# ~/.config/orchard-themes/active/tmux.conf. Same structure as the
# catppuccin partials: a bar one step above the base, muted inactive
# tabs, and a flipped active tab.

# Status line: overlay bar with the text color.
set -g status-style "bg=#393552,fg=#e0def4"

# Command prompt and messages: terminal-yellow slab, as tmux drew it
# before 3.8 moved the default onto its builtin theme colors.
set -g message-style "bg=#f6c177,fg=#393552,fill=#f6c177"

# Pane borders. Both active and inactive match the bar so window/pane
# chrome reads as one coherent surface.
set -g pane-border-style "fg=#393552"
set -g pane-active-border-style "fg=#393552"

# Inactive window tab — subtle text on the bar color.
set -g window-status-style "bg=#393552,fg=#908caa"

# Active window tab — flipped: bar color text on a text-colored slab.
set -g window-status-current-style "bg=#e0def4,fg=#393552"
