# Gruvbox Dark colors for fuzzel. See catppuccin-frappe/fuzzel.ini for why
# the panel sits one step above the base, why it is opaque, and why the
# border carries the focused-window accent.
#
# The accent blue is too dark to read as text on the panel, so matched
# letters take its bright counterpart.

[colors]
background=3c3836ff
text=ebdbb2ff
prompt=d5c4a1ff
input=ebdbb2ff
match=83a598ff
selection=504945ff
selection-text=fbf1c7ff
selection-match=83a598ff
border=458588ff
