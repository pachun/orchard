# Solarized Dark colors for fuzzel. See catppuccin-frappe/fuzzel.ini for why
# the panel sits one step above the base, why it is opaque, and why the
# border carries the focused-window accent.
#
# Solarized has no tone between base02 (the panel) and base01, and base01 is
# too light to sit behind text, so the selected row is a blend of the two.

[colors]
background=073642ff
text=839496ff
prompt=93a1a1ff
input=839496ff
match=268bd2ff
selection=164450ff
selection-text=eee8d5ff
selection-match=268bd2ff
border=268bd2ff
