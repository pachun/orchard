# Tokyo Night colors for tmux. Sourced from the main tmux.conf through
# ~/.config/orchard-themes/active/tmux.conf. Same structure as the
# catppuccin partials: a bar one step above the base, muted inactive
# tabs, and a flipped active tab.

# Status line: selection-colored bar with the foreground text.
set -g status-style "bg=#292e42,fg=#a9b1d6"

# Command prompt and messages: terminal-yellow slab, as tmux drew it
# before 3.8 moved the default onto its builtin theme colors.
set -g message-style "bg=#e0af68,fg=#15161e,fill=#e0af68"

# Pane borders. Both active and inactive match the bar so window/pane
# chrome reads as one coherent surface.
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#292e42"

# Inactive window tab — light foreground on the bar color.
set -g window-status-style "bg=#292e42,fg=#b4bee6"

# Active window tab — flipped: bar color text on a light-foreground slab.
set -g window-status-current-style "bg=#b4bee6,fg=#292e42"
