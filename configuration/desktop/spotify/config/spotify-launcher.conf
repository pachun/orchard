# Extra arguments spotify-launcher hands to the Spotify client.
#
# Put the window on Wayland. Left to itself the client picks X11, and Hyprland
# then renders it through XWayland at logical size and upscales the result —
# soft, grainy text on a 2880x1800 display.
#
# chromium-flags.conf gets to say `--ozone-platform-hint=auto`, which means
# "Wayland if there is one, X11 otherwise". Spotify's client is Chromium-based
# but old enough that the hint flag doesn't exist in it (it knows
# `ozone-platform` and nothing else), so the platform has to be named outright.
# That's safe while every orchard desktop is Hyprland; a machine running an X11
# session would need these two arguments dropped.
#
# Naming wayland also lowercases the window class — X11 reports `Spotify` off
# WM_CLASS, Wayland reports `spotify` off the app id. hyprland.conf's
# $musicWindowClass tracks that, and Cmd+M breaks if the two disagree.
[spotify]
extra_arguments = ["--enable-features=UseOzonePlatform", "--ozone-platform=wayland"]
