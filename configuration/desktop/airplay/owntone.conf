# OwnTone as an AirPlay 2 sender for the desktop — see the airplay feature's
# install.sh for the architecture. The library is a single named pipe fed by
# PipeWire's airplay_sink; audio type disabled because OwnTone never plays
# locally, it only forwards to AirPlay speakers.
general {
    uid = "owntone"
    # The default is /var/log/owntone.log, which the owntone user cannot
    # create — the daemon exits on the spot. The cache dir is its own.
    logfile = "/var/cache/owntone/owntone.log"
}
library {
    name = "orchard airplay"
    directories = { "/var/lib/owntone/library" }
    pipe_autostart = true
}
audio {
    type = "disabled"
}
