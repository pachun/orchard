# AirPlay speakers as audio sinks. RAOP (Remote Audio Output Protocol) is
# the protocol behind AirPlay; this module watches mDNS for speakers
# announcing themselves and adds each one to PipeWire as an ordinary sink.
#
# Once they show up, they're sinks like any other — nothing needs to know
# it's AirPlay. Spotify in the browser, mpv, a notification chime, all of
# it can be routed to a HomePod or Apple TV from the normal output picker.
#
# Discovery is mDNS, so this is inert without avahi-daemon running; the
# feature's install.sh enables it.
context.modules = [
  { name = libpipewire-module-raop-discover }
]
