# The "AirPlay" sink. Everything routed here is written as PCM16/44.1kHz
# into a named pipe that OwnTone watches (pipe_autostart) — OwnTone then
# streams it to whichever AirPlay speakers are enabled, doing the AirPlay 2
# handshakes PipeWire cannot (device verification, passwords). may-pause
# stops the pipe when nothing is playing, which is what tells OwnTone to
# stop streaming.
context.modules = [
  { name = libpipewire-module-pipe-tunnel
    args = {
      tunnel.mode = sink
      tunnel.may-pause = true
      pipe.filename = "/var/lib/owntone/library/airplay.fifo"
      audio.format = S16LE
      audio.rate = 44100
      audio.channels = 2
      audio.position = [ FL FR ]
      node.name = airplay_sink
      node.description = "AirPlay"
      stream.props = {
        # Never the automatic default: on a machine with no stored sink
        # choice WirePlumber picks the highest session priority, and the
        # tunnel outranked the speakers on first boot — every stream
        # played into an idle OwnTone pipe and the laptop went silent.
        # Speakers sit around 1000; AirPlay is opt-in via audio-menu.
        priority.session = 100
      }
    }
  }
]
