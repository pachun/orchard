# Which backend answers each portal request. This file wholly replaces
# the one Hyprland's package ships at /usr/share/xdg-desktop-portal/ —
# portals.conf is picked by first match, not merged — so the `default`
# line below has to restate what that file already said.
#
# The Wallpaper line is the reason this file exists. Nothing claimed that
# portal on a Hyprland session (only GNOME's backend implements it, and
# it writes a gsettings key awww never reads), which is why Nautilus's
# built-in "Set as Wallpaper" was a no-op. Pointing it at orchard's own
# backend makes that menu item work.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.Wallpaper=orchard
