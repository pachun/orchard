# How many wrong passwords in a row lock the account, and for how long.
# Installed to /etc/security/faillock.conf by the lock feature in place of
# the one the pam package ships; pam_faillock reads it for every login on the
# machine, not just the lock screen.
#
# The package defaults are three misses, then ten minutes locked out. Three is
# one fumbled password away from a lockout and ten minutes is a long time to
# stare at a lock screen for it. Ten misses is still nothing to a brute force
# and plenty for a person; three minutes is long enough to make guessing
# pointless and short enough to wait out.
deny = 10
unlock_time = 180
