# What happens when you walk away.
#
# The point of this is the panel, not privacy. The screen is OLED, and on OLED
# every lit pixel ages — so the only real protection against burn-in is the
# panel being *off*. A screensaver is the opposite of that: it lights pixels for
# twenty minutes to protect against a failure mode (CRT phosphor) this display
# doesn't have. So there's no screensaver here. It dims, it locks, it goes dark.
#
# Before any of this existed the screen simply never turned off — no idle daemon
# at all, and logind's IdleAction left at `ignore`. It was lit from login to lid.

general {
    # `pidof hyprlock || hyprlock` and not plain `hyprlock`: without the guard,
    # anything that asks for a lock while one is already up starts a second
    # instance on top of the first, and each wants its own password.
    lock_cmd = pidof hyprlock || hyprlock

    # Lock on the way *into* sleep, not on the way out. Suspending an unlocked
    # session means the desktop is sitting there in plain sight the instant the
    # lid opens, before anything has a chance to lock it.
    before_sleep_cmd = loginctl lock-session

    # Waking from suspend leaves the panel powered down. Nothing else turns it
    # back on, so the machine appears dead.
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 5 minutes: dim. Cheap, instantly reversible, and on OLED a dimmer pixel is a
# slower-ageing pixel — this is doing real work, not just signalling.
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 10 minutes: lock.
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 10 minutes and 30 seconds: the panel goes off.
#
# This is deliberately *after* the lock and not simultaneous with it. Fire both
# at once and they race: DPMS can win, and then hyprlock is painting into a
# screen that is already dark. Wake it and you get a frame or two of your
# unlocked desktop before the lock surface appears. The 30 seconds guarantee the
# lock is up and painted before the panel dies. You never see the gap — you've
# been gone ten minutes and the screen is already dim.
listener {
    timeout = 630
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
