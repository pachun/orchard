# The lock screen.
#
# By default it shows the wallpaper you're actually using — not a theme's
# shipped one — via the `current` symlink set-wallpaper maintains. A wallpaper
# you chose by hand outranks the theme's and survives a theme switch, so the
# lock screen has to follow the same rule or it'd show you a picture you'd
# already replaced.
#
# What's on it is fixed: the time, the date, the password field, what the
# fingerprint reader is doing, and the battery. Each one is there because it
# is useful at a lock screen no matter what the desktop looks like, so no
# theme gets to drop one. Where it sits, how big it is, and what color it is
# are the theme's to play with: everything below the "a theme may change"
# line is a variable, with the shared layout as its default, and the active
# theme's hyprlock.conf is sourced after the defaults so it can reassign any
# of them — including the picture, for a theme whose lock wants to look
# different from its desktop. A theme that likes the shared layout ships a
# partial that reassigns nothing.
#
# hyprlock uses the ext-session-lock protocol, which means the compositor itself
# guarantees nothing renders behind it. That's the difference from the old X11
# screen-lockers, which were ordinary windows you could sometimes crash out of.

# Password via PAM, and — where fprintd has a reader and an enrolled finger —
# fingerprint via its D-Bus service (the fingerprint feature installs it). On
# machines without one, hyprlock logs that Fprint is unreachable and the
# password path is untouched, so this is safe to enable everywhere.
auth {
    pam {
        enabled = true
    }
    fingerprint {
        enabled = true
        ready_message = Rest a finger on the power button to unlock
        present_message = Reading…
    }
}

# ---- What a theme may change ------------------------------------------------
# Positions are "x, y" offsets from the aligned edge, the way hyprlock reads
# them: y is up, whatever the alignment, so a bottom-aligned piece lifts off
# the bottom edge with a positive y and a top-aligned piece drops below the
# top edge with a negative one. The unit is the panel's own pixels, not the
# scaled logical ones the desktop is laid out in — on the XPS, twice the
# logical count. A centered piece is centered on the screen's midline plus
# its x. Font sizes are points, so 160 draws about 213 pixels tall. Colors are rgba(rrggbbaa) / rgb(rrggbb). The two
# placeholder colors are Pango markup, hence the ## (hyprlang's escape for a
# literal #).

$background_image = $HOME/.local/state/orchard/wallpapers/current
# Enough blur to make the desktop unreadable over your shoulder, enough
# brightness left that the wallpaper is still recognisably yours.
$background_blur_passes = 3
$background_blur_size = 7
$background_brightness = 0.55

# A share of the screen rather than a pixel count, so the field is the same
# size on the Mac, whose panel is a different resolution. hyprlock's own
# default is 20% x 5%, which on a 1440-wide desktop is a small target for
# the one thing on screen you have to hit.
$input_size = 30%, 8%
$input_position = 0, -110
$input_halign = center
$input_valign = center
$input_outer_color = rgba(ffffff4d)
$input_inner_color = rgba(0000004d)
$input_font_color = rgba(ffffffff)
$input_check_color = rgba(ffffff88)
$input_fail_color = rgba(e06c75cc)
$input_placeholder_color = ##ffffffaa
$input_fail_text_color = ##ffffffcc

# The time, and it is the whole composition. A lock screen has one job and an
# entire display to do it in — an 88px clock on a 900px-tall desktop was sized
# like a widget on a busy page rather than the only thing in the room.
$clock_font_size = 160
$clock_color = rgba(ffffffff)
$clock_position = 0, 190
$clock_halign = center
$clock_valign = center

$date_font_size = 28
$date_color = rgba(ffffffcc)
$date_position = 0, 45
$date_halign = center
$date_valign = center

# What the fingerprint reader is doing, under the password field.
$fingerprint_prompt_font_size = 16
$fingerprint_prompt_color = rgba(ffffffaa)
$fingerprint_prompt_position = 0, -210
$fingerprint_prompt_halign = center
$fingerprint_prompt_valign = center

# The battery, small and low, where the bar's battery would be if there were a
# bar — the one thing worth knowing at a lock screen besides the time.
$battery_font_size = 16
$battery_color = rgba(ffffffaa)
$battery_position = 0, 40
$battery_halign = center
$battery_valign = bottom

source = $HOME/.config/orchard-themes/active/hyprlock.conf
# -----------------------------------------------------------------------------

background {
    monitor =
    path = $background_image
    blur_passes = $background_blur_passes
    blur_size = $background_blur_size
    brightness = $background_brightness
}

input-field {
    monitor =
    size = $input_size
    position = $input_position
    halign = $input_halign
    valign = $input_valign

    outline_thickness = 2
    rounding = 10                # the radius everything else here uses

    outer_color = $input_outer_color
    inner_color = $input_inner_color
    font_color = $input_font_color
    check_color = $input_check_color
    fail_color = $input_fail_color

    placeholder_text = <span foreground="$input_placeholder_color">Password</span>
    fail_text = <span foreground="$input_fail_text_color">$FAIL</span>
    hide_input = false
    dots_center = true
}

# SF Pro Display, not Text: Apple splits the family at 20pt, and Display is the
# cut drawn for large sizes — tighter spacing, finer detail in the curves. Text
# at 160px looks bloated in a way that's hard to name and easy to see.
#
# No weight is set here, deliberately. hyprlock has no font_weight, so a weight
# would have to ride in the family string — and `SF Pro Display Light` is
# resolved by fontconfig as a *family name*, which doesn't exist, landing you in
# FreeSans. Regular at this size reads fine; a wrong font would not.
label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M"
    color = $clock_color
    font_size = $clock_font_size
    font_family = SF Pro Display
    position = $clock_position
    halign = $clock_halign
    valign = $clock_valign
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = $date_color
    font_size = $date_font_size
    font_family = SF Pro Text
    position = $date_position
    halign = $date_halign
    valign = $date_valign
}

# On machines without a reader $FPRINTPROMPT stays empty, which leaves this
# label invisible — same trick as lock-battery below.
label {
    monitor =
    text = $FPRINTPROMPT
    color = $fingerprint_prompt_color
    font_size = $fingerprint_prompt_font_size
    font_family = SF Pro Text
    position = $fingerprint_prompt_position
    halign = $fingerprint_prompt_halign
    valign = $fingerprint_prompt_valign
}

# Same glyph set as the bar, so a glance at either says the same. lock-battery
# prints nothing on a machine without one, which leaves this label empty.
label {
    monitor =
    text = cmd[update:30000] $HOME/.local/bin/lock-battery
    color = $battery_color
    font_size = $battery_font_size
    font_family = SF Pro Text
    position = $battery_position
    halign = $battery_halign
    valign = $battery_valign
}
