# The lock screen.
#
# It shows the wallpaper you're actually using — not a theme's shipped one — via
# the `current` symlink set-wallpaper maintains. A wallpaper you chose by hand
# outranks the theme's and survives a theme switch, so the lock screen has to
# follow the same rule or it'd show you a picture you'd already replaced.
#
# There is no per-theme colour partial here on purpose. The background is the
# wallpaper, which is already themed; white text on a dimmed image reads on all
# four themes, including the light one. A palette would be four more files
# solving a problem the wallpaper already solves.
#
# hyprlock uses the ext-session-lock protocol, which means the compositor itself
# guarantees nothing renders behind it. That's the difference from the old X11
# screen-lockers, which were ordinary windows you could sometimes crash out of.

background {
    monitor =
    path = $HOME/.local/state/orchard/wallpapers/current

    # Enough blur to make the desktop unreadable over your shoulder, enough
    # brightness left that the wallpaper is still recognisably yours.
    blur_passes = 3
    blur_size = 7
    brightness = 0.55
}

input-field {
    monitor =
    # A share of the screen rather than a pixel count, so the field is the same
    # size on the Mac, whose panel is a different resolution. hyprlock's own
    # default is 20% x 5%, which on a 1440-wide desktop is a small target for
    # the one thing on screen you have to hit.
    size = 30%, 8%
    position = 0, -110
    halign = center
    valign = center

    outline_thickness = 2
    rounding = 10                # the radius everything else here uses
    font_size = 20

    outer_color = rgba(255255554d)
    inner_color = rgba(0000004d)
    font_color = rgba(ffffffff)
    check_color = rgba(ffffff88)
    fail_color = rgba(e06c75cc)

    placeholder_text = <span foreground="##ffffffaa">Password</span>
    fail_text = <span foreground="##ffffffcc">$FAIL</span>
    hide_input = false
    dots_center = true
}

# The time, and it is the whole composition. A lock screen has one job and an
# entire display to do it in — an 88px clock on a 900px-tall desktop was sized
# like a widget on a busy page rather than the only thing in the room.
#
# SF Pro Display, not Text: Apple splits the family at 20pt, and Display is the
# cut drawn for large sizes — tighter spacing, finer detail in the curves. Text
# at 160px looks bloated in a way that's hard to name and easy to see.
#
# No weight is set here, deliberately. hyprlock has no font_weight, so a weight
# would have to ride in the family string — and `SF Pro Display Light` is
# resolved by fontconfig as a *family name*, which doesn't exist, landing you in
# FreeSans. Regular at this size reads fine; a wrong font would not.
label {
    monitor =
    text = cmd[update:1000] date +"%-I:%M"
    color = rgba(ffffffff)
    font_size = 160
    font_family = SF Pro Display
    position = 0, 190
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    color = rgba(ffffffcc)
    font_size = 28
    font_family = SF Pro Text
    position = 0, 45
    halign = center
    valign = center
}
