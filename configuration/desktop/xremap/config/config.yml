# Remap macOS-style Cmd+letter shortcuts to their Ctrl+letter equivalents,
# everywhere except the terminal (where Ctrl+C must remain SIGINT, and the
# terminal handles Cmd+C as copy via its own keybind).
#
# On Apple keyboards, Cmd is the Super key. Hyprland's window-manager binds
# (Super+RETURN, Super+B, etc.) are NOT affected because we only remap the
# specific letter combos listed below — bare Super and Super+other-keys
# pass through untouched.

# Caps Lock → Ctrl at the input layer. Done in xremap rather than via
# Hyprland's `kb_options = ctrl:nocaps` so the keymap rules below see
# real Ctrl events when the user presses Caps. Hyprland's XKB-level
# remap runs *after* xremap, so it would have left xremap blind to the
# Caps-as-Ctrl press.
modmap:
  - name: caps lock → control
    remap:
      CapsLock: Ctrl_L

keymap:
  # The file browser (Folio): h/j/k/l navigate (see the rules further
  # down). Folio has no type-ahead, so the only places letters are typed are
  # its text fields: search, the path bar, rename and new folder. Opening one
  # switches to folio-typing mode so h/j/k/l type letters there; confirming
  # or dismissing the field returns to the default mode. These rules sit
  # above the macOS block so Cmd+W closes the window here, where Ctrl+W
  # would only close a split pane.
  - name: "file browser: leave typing mode"
    application:
      only:
        - folio
    mode: folio-typing
    exact_match: true
    remap:
      Esc: [Esc, { set_mode: default }]
      Enter: [Enter, { set_mode: default }]
      Super-w: [Esc, q, { set_mode: default }]

  - name: "file browser: Cmd+W closes the window"
    application:
      only:
        - folio
    mode: default
    exact_match: true
    remap:
      Super-w: q

  - name: macOS-style shortcuts (skipped in ghostty)
    # exact_match=true keeps these rules from swallowing Shift-modified
    # variants. Without it, xremap's default loose-match treats Super-3
    # as matching Super+Shift+3, which would steal the screenshot bind
    # (and Super-V the clipboard-history bind, etc.) before Hyprland
    # ever sees them.
    exact_match: true
    application:
      not:
        - com.mitchellh.ghostty
    remap:
      Super-c: C-c   # copy
      Super-v: C-v   # paste
      Super-x: C-x   # cut
      Super-a: C-a   # select all
      Super-z: C-z   # undo
      Super-w: C-w   # close tab (or window if last tab)
      Super-t: C-t   # new tab
      Super-Shift-t: C-Shift-t   # reopen last closed tab
      Super-f: C-f   # find in page
      Super-s: C-s   # save
      Super-r: C-r   # reload page
      # DevTools, macOS-style: Cmd+Option+I opens last panel,
      # Cmd+Option+J opens to Console. On chromium Linux these are
      # Ctrl+Shift+I and Ctrl+Shift+J.
      Super-Alt-i: C-Shift-i
      Super-Alt-j: C-Shift-j

  - name: "file browser: hjkl — up a folder / down / up / open"
    application:
      only:
        - folio
    mode: default
    exact_match: true
    remap:
      h: Backspace
      j: Down
      k: Up
      l: Enter

  # The preview window (Space in Folio) is its own app. Up and down step to
  # the file above or below, or scroll one that is taller than the window;
  # left and right always step.
  - name: "file browser preview: hjkl — previous / down / up / next"
    application:
      only:
        - folio-preview
    exact_match: true
    remap:
      h: Left
      j: Down
      k: Up
      l: Right

  - name: "file browser: keys that put the cursor in a text field"
    application:
      only:
        - folio
    mode: default
    exact_match: true
    remap:
      Slash: [Slash, &enter_typing { set_mode: folio-typing }]
      F2: [F2, *enter_typing]
      C-l: [C-l, *enter_typing]
      Alt-d: [Alt-d, *enter_typing]
      C-Shift-n: [C-Shift-n, *enter_typing]

  - name: tab navigation (Cmd+Shift+[/]) — applied everywhere
    remap:
      # Cmd+Shift+[ → Ctrl+Shift+Tab (previous tab)
      Super-Shift-LeftBrace: C-Shift-Tab
      # Cmd+Shift+] → Ctrl+Tab (next tab)
      Super-Shift-RightBrace: C-Tab

  - name: page navigation (Cmd+Left/Right) — applied everywhere
    # Linux chromium uses Alt+Left/Right for back/forward in history;
    # macOS uses Cmd+Left/Right. Rewriting at the input layer means
    # chromium (and any other app that respects Alt+Left/Right
    # navigation) gets the macOS muscle memory. exact_match=true
    # keeps Cmd+Shift+Left etc. (text selection) from being eaten
    # by this rule.
    exact_match: true
    remap:
      Super-Left: Alt-Left
      Super-Right: Alt-Right

  # More specific (Super+Ctrl+N) MUST come before Super+N. xremap evaluates
  # rules top-down and stops at the first match; if Super+N came first,
  # Cmd+Ctrl+N would trigger a workspace switch instead of moving the
  # focused window.
  #
  # exact_match=true on both rules below for the same reason as the
  # macOS-style shortcuts above: without it, Super-3 also matches
  # Super+Shift+3, stealing the Cmd+Shift+3 screenshot bind.
  - name: move window to workspace (Cmd+Ctrl+1..5)
    exact_match: true
    remap:
      Super-Ctrl-1: { launch: ["hyprctl", "dispatch", "hl.dsp.window.move({ workspace = \"1\" })"] }
      Super-Ctrl-2: { launch: ["hyprctl", "dispatch", "hl.dsp.window.move({ workspace = \"2\" })"] }
      Super-Ctrl-3: { launch: ["hyprctl", "dispatch", "hl.dsp.window.move({ workspace = \"3\" })"] }
      Super-Ctrl-4: { launch: ["hyprctl", "dispatch", "hl.dsp.window.move({ workspace = \"4\" })"] }
      Super-Ctrl-5: { launch: ["hyprctl", "dispatch", "hl.dsp.window.move({ workspace = \"5\" })"] }

  - name: workspace switching (Cmd+1..5)
    exact_match: true
    remap:
      Super-1: { launch: ["workspace-switch", "1"] }
      Super-2: { launch: ["workspace-switch", "2"] }
      Super-3: { launch: ["workspace-switch", "3"] }
      Super-4: { launch: ["workspace-switch", "4"] }
      Super-5: { launch: ["workspace-switch", "5"] }
