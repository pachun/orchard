# Connection defaults for machines with MediaTek Wi-Fi (the Framework
# 13's MT7925). The radio wakes from s2idle deaf for a few seconds, so
# the first WPA handshakes after resume time out, wpa_supplicant calls
# that a wrong key, and NetworkManager blocks autoconnect — the network
# looks forgotten until reconnected by hand.
[connection]
# Enough attempts to outlast the radio's wake-up; wpa_supplicant's 10s
# wrong-key backoff spaces them out.
connection.auth-retries=5
# 2 = disable. The mt76 family's post-resume deafness is power-save
# related; disabling it is the community-standard mitigation.
wifi.powersave=2
