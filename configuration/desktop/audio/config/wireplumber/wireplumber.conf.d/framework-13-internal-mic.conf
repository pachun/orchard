# The Framework 13's internal mic hangs off the ALC285 HDA codec, which only
# surfaces under the Mic1+Mic2 card profile — the profile WirePlumber picks
# on its own exposes the mic slot through the AMD ACP PDM controller
# (hw:acppdmmach) instead, a capture device that isn't wired to anything on
# this board and records a railed constant. Prefer the profile with the
# working route, and drop the PDM-backed sources so no picker offers a dead
# mic. Matched by the codec's component string (f111 is Framework's PCI
# subsystem vendor id), so other machines are untouched.

device.profile.priority.rules = [
  {
    matches = [
      {
        alsa.components = "HDA:10ec0285,f111000b,00100002"
      }
    ]
    actions = {
      update-props = {
        priorities = [ "HiFi (Mic1, Mic2, Speaker)" ]
      }
    }
  }
]

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.*"
        api.alsa.path = "hw:acppdmmach"
      }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
