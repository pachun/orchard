# Runs bluetoothd with --experimental, exposing the per-transport Bearer.LE1
# interface that ANCS notification mirroring rides on. Must be active before
# pairing; a bond made without it has no LE half and has to be redone.
#
# tether-bin shipped this drop-in until 0.2.26, which dropped the file and
# prints the equivalent command from `tether --bt-setup` instead — so orchard
# carries it. The bluetoothd path is where Arch's bluez puts the binary.
[Service]
ExecStart=
ExecStart=/usr/lib/bluetooth/bluetoothd --experimental
