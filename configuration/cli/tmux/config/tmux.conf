# Tell tmux the outer terminal supports truecolor + 256 colors. Without
# this, RGB color escapes get clamped to 8-bit and themes/highlights look
# muted — nvim's orchard-theme colors come out visibly washed out.
set -g default-terminal "tmux-256color"
set -ag terminal-features ",xterm-ghostty:RGB,256"

# replace ctrl-b prefix with ctrl-a
unbind C-b
set-option -g prefix C-a

# immediately process escapes to switch from insert <-> edit mode in zsh's vi mode (tmux waits 500ms by default)
set -sg escape-time 0

# open new windows at the end of the window list at the current directory with prefix-c
bind c new-window -a -c "#{pane_current_path}"

# Switch windows uing h and l
bind-key -r C-h select-window -t :-
bind-key -r C-l select-window -t :+

# Move windows right and left using o and p
unbind o
bind o swap-window -t -1\; select-window -t -1
unbind p
bind p swap-window -t +1\; select-window -t +1

# split panes using | and _ instead of " and %
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"

# create pane with bottom 8 lines
unbind ^T
bind ^T split-window -v -l 8 -c '#{pane_current_path}'

# use vim directionals (ctrl-[hjkl]) to navigate panes
# works inside vim, given: Plug 'christoomey/vim-tmux-navigator' in vimrc
#
# gitspine (the TUI git client) is matched here too, so while it's the
# foreground process tmux forwards ctrl-[hjkl] into it rather than
# switching panes. gitspine only keeps them on its staging screen — to
# move between files and the unstaged/staged boxes; anywhere else it
# runs `tmux select-pane` itself to hand the switch back, exactly how
# vim-tmux-navigator passes through at a split edge. Net effect: these
# switch panes as usual unless you're on gitspine's staging screen.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?(g?(view|n?vim?x?)(diff)?|gitspine)$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"

# maximize the cursor's pane
unbind +
bind + resize-pane -Z

# enable resizing panes
# in ghostty, double click panes to focus them
# in ghostty, triple click windows to focus them
set -g mouse on

# Kill middle-click entirely. libinput maps a 3-finger tap to a middle
# click (tap_button_map defaults to lrm), and a palm resting on the pad
# lands one often enough that tmux's default MouseDown2Pane — paste-buffer
# — dumps the clipboard into the prompt several times a day. Nothing here
# uses a middle click on purpose, so unbinding it is a free win.
unbind -n MouseDown2Pane

# When the focused pane is running an alternate-screen app (vim, less, claude, etc),
# forward mouse-wheel events to the app so its own scrollback works. Otherwise fall
# back to tmux copy-mode for ordinary shell scrollback.
bind-key -T root WheelUpPane   if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; copy-mode -e; send-keys -M"
bind-key -T root WheelDownPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; send-keys -M"

# prompt for a custom session name on detach if one has not been set
bind-key d run-shell '
if [[ $(tmux display-message -p "#S") =~ ^[0-9]+$ ]]; then
  tmux command-prompt -p "Rename session:" "rename-session %%";
fi;
tmux detach-client'

# reload the configuration with prefix+r
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded ~/.config/tmux/tmux.conf"

# prefix+t — session switcher / creator. Pops a prompt showing the
# current session list inline; type to filter; Tab autocompletes;
# Enter switches if the name exists, creates+switches if not. Mirrors
# the `t` zsh function so we get the same garbage-collect-idle-source
# behavior regardless of whether you invoke from a shell or here.
# (Default `prefix+t` is the fullscreen clock; we override.)
unbind t
bind t run-shell '~/.local/bin/tmux-session-prompt'

# Status-line layout. Colors deliberately live elsewhere — see the
# per-theme tmux.conf partials sourced at the bottom of this file.
# Why: tmux's ANSI-slot defaults (`fg=colour0` etc.) silently mean
# "the brightest cream" in a light-theme palette and "the deepest
# grey" in a dark one. That ambiguity made dawn's status line and
# pane borders nearly invisible against the cream terminal bg.
# Per-theme hex values dodge the slot confusion entirely.
set -g status-left ""
set -g status-right ""
set -g status-justify left
set-option -g status-position bottom

# Window-tab format owns padding only (the spaces around `#W`);
# colors come from window-status-style / window-status-current-style
# in the per-theme partial. Splitting layout from color means a
# theme swap doesn't have to re-state the format string.
setw -g window-status-format " #W "
setw -g window-status-current-format " #W "

# Pull the active theme's colors. `-q` (quiet) so an unset theme
# (first run before set-theme has populated `active`) doesn't make
# tmux startup error noisy. set-theme re-sources this file in
# every running tmux server after swapping the active symlink.
source-file -q ~/.config/orchard-themes/active/tmux.conf
